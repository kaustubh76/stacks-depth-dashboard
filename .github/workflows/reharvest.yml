name: re-harvest stacks depth

# Keeps the dashboard's on-chain measurement fresh: re-runs the harvest from chain, regenerates the
# baked data (src/data/*.json), and commits any change — Render's autoDeploy then ships fresh
# numbers. Runs on a schedule + on demand. Keyless works (slow, ~20-30 min); add a HIRO_API_KEY repo
# secret (Settings → Secrets and variables → Actions) for the ~3-min fast path.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours (UTC)
  workflow_dispatch: {} # manual "Run workflow" button

permissions:
  contents: write
  issues: write # open/append a failure-alert issue if a harvest breaks (see the final step)

concurrency:
  group: reharvest
  cancel-in-progress: false

jobs:
  reharvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install harvest deps
        run: pip install -r harvest/requirements.txt

      - name: Re-harvest + regenerate baked data
        env:
          HIRO_API_KEY: ${{ secrets.HIRO_API_KEY }}
        run: PYTHONPATH=harvest python harvest/regenerate.py

      # Gate: the committed TS compute suite must reproduce the freshly-harvested numbers before we
      # ship them. If depth.ts can't reproduce study.json (a broken harvest or a math regression),
      # this fails BEFORE the commit/push, so Render never deploys wrong figures.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify compute reproduces the fresh data
        run: |
          npm install
          npm test

      - name: Commit refreshed data (if changed)
        run: |
          git config user.name "stacks-depth-bot"
          git config user.email "stacks-depth-bot@users.noreply.github.com"
          if git diff --quiet -- src/data; then
            echo "no change in src/data — nothing to commit"
          else
            AS_OF=$(python -c "import json;print(json.load(open('src/data/summary.json'))['as_of_date'])")
            git add src/data
            git commit -m "chore: re-harvest stacks depth ($AS_OF) [auto]"
            git push
            echo "pushed refreshed data — Render will auto-deploy"
          fi

      # Make a broken harvest VISIBLE instead of silently freezing the data. Runs only on failure of any
      # step above (harvest error, or the npm-test reproducibility gate). Dedups: reuse one open alert
      # issue rather than spamming every 6h. Uses the preinstalled gh CLI + GITHUB_TOKEN (no marketplace
      # action → no supply-chain surface).
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Re-harvest failed"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again — the committed dataset did not refresh. Run: $run_url"
          else
            gh issue create --title "$title" \
              --body "The scheduled re-harvest (or its npm-test reproducibility gate) failed, so src/data did not refresh and the live site is serving the last good snapshot. Latest failing run: $run_url"
          fi
